    let audioActual = null;

    function detenerAudioActual() {
      if (audioActual) {
        audioActual.pause();
        audioActual.currentTime = 0;
      }
      if (botonActual) {
        botonActual.innerHTML = "&#9654;";
        botonActual.classList.remove("playing");
      }
    }

    function reproducirConBoton(boton, archivoAudio) {
      const ruta = AUDIO_BASE + archivoAudio;

      if (botonActual === boton && audioActual) {
        if (!audioActual.paused) {
          audioActual.pause();
          boton.innerHTML = "&#9654;";
          boton.classList.remove("playing");
        } else {
          audioActual.play().then(() => {
            boton.innerHTML = "&#10074;&#10074;";
            boton.classList.add("playing");
          }).catch(() => {
            boton.innerHTML = "&#9654;";
            boton.classList.remove("playing");
            alert("Aún no se encuentra el audio: " + ruta);
          });
        }
        return;
      }

      detenerAudioActual();

      audioActual = new Audio(ruta);
      botonActual = boton;

      audioActual.play().then(() => {
        boton.innerHTML = "&#10074;&#10074;";
        boton.classList.add("playing");
      }).catch(() => {
        boton.innerHTML = "&#9654;";
        boton.classList.remove("playing");
        alert("Aún no se encuentra el audio: " + ruta);
      });

      audioActual.addEventListener("ended", () => {
        if (botonActual === boton) {
          boton.innerHTML = "&#9654;";
          boton.classList.remove("playing");
        }
      });
    }

    function reproducirIntroUnaVez(recetaId, archivoAudio) {
      const clave = "intro_reproducida_diabeticos_" + recetaId;
      let yaReproducido = false;

      try {
        yaReproducido = sessionStorage.getItem(clave) === "1";
      } catch (e) {}

      if (yaReproducido) return;

      const ruta = AUDIO_BASE + archivoAudio;
      audioActual = new Audio(ruta);
      botonActual = null;

      audioActual.play().then(() => {
        try {
          sessionStorage.setItem(clave, "1");
        } catch (e) {}
      }).catch(() => {});
    }

    if (!receta) {
      document.getElementById("recipe-view").innerHTML =
        '<div class="not-found"><h2>Receta no encontrada</h2><p>Vuelve al menú para seleccionar una ensalada.</p></div>';
    } else {
      document.title = receta.titulo + " - Recetario";
      document.getElementById("receta-titulo").textContent = receta.titulo;
      document.getElementById("receta-intro").textContent = receta.subtitulo;

      const img = document.getElementById("receta-img");
      img.src = IMG_BASE + receta.imagen;
      img.alt = receta.titulo;

      const listaIng = document.getElementById("receta-ingredientes");
      receta.ingredientes.forEach((item) => {
        const li = document.createElement("li");
        if (item.trim().startsWith("<b>")) {
          li.className = "group-title";
          li.innerHTML = item;
        } else {
          li.innerHTML = "<span>&#129367;</span><span>" + item + "</span>";
        }
        listaIng.appendChild(li);
      });

      const listaPasos = document.getElementById("receta-pasos");
      receta.pasos.forEach((paso, index) => {
        const li = document.createElement("li");
        li.innerHTML =
          '<span class="step-number">' +
          (index + 1) +
          "</span><span>" +
          paso +
          "</span>";
        listaPasos.appendChild(li);
      });

      document.getElementById("btn-audio-ingredientes").addEventListener("click", function () {
        reproducirConBoton(this, receta.audioIngredientes);
      });

      document.getElementById("btn-audio-instrucciones").addEventListener("click", function () {
        reproducirConBoton(this, receta.audioInstrucciones);
      });

      // Reproducción automática de la introducción solo la primera vez que se abre esta receta
      reproducirIntroUnaVez(id, receta.audioIntro);
    }
  </script>
</body>
</html>
