<!DOCTYPE html>
<html lang="es">
<head>
    <script src="guardia.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta - Recetario Saludable</title>
    
    <style>
        :root {
            --color-fondo: #f4f7f6;
            --color-primario: #2e7d32;
            --color-secundario: #4caf50;
            --color-texto: #333333;
            --color-blanco: #ffffff;
            --color-gris-claro: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--color-fondo); color: var(--color-texto); display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 480px; background-color: var(--color-blanco); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); padding-bottom: 30px; }
        
        .nav-bar { background-color: var(--color-primario); color: var(--color-blanco); padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 10; }
        .back-btn { color: var(--color-blanco); text-decoration: none; font-size: 1.5rem; margin-right: 15px; cursor: pointer; }
        .nav-bar h2 { font-size: 1.2rem; font-weight: 500; }

        .media-container { width: 100%; display: flex; overflow: hidden; }
        .recipe-image { width: 100%; height: auto; display: block; object-fit: cover; }

        .recipe-content { padding: 20px; }
        
        .header-with-audio { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .recipe-title { font-size: 1.8rem; color: var(--color-primario); }
        .section-title { font-size: 1.3rem; color: var(--color-texto); border-bottom: 2px solid var(--color-secundario); padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px;}

        .audio-icon-btn {
            background-color: #e8f5e9;
            color: var(--color-primario);
            border: 1px solid var(--color-secundario);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0; 
        }
        .audio-icon-btn.playing { background-color: #ffebee; border-color: #f44336; color: #d32f2f; }

        .recipe-description { font-size: 0.95rem; line-height: 1.5; color: #555; margin-bottom: 20px; font-style: italic; }
        
        .ingredients-list { list-style-type: none; margin-bottom: 20px; }
        .ingredients-list li { padding: 10px 0; border-bottom: 1px solid var(--color-gris-claro); font-size: 0.95rem; }
        .ingredients-list li::before { content: "🥗 "; }

        .steps-list { counter-reset: step-counter; list-style-type: none; margin-bottom: 20px; }
        .steps-list li { position: relative; padding-left: 40px; margin-bottom: 20px; line-height: 1.5; font-size: 0.95rem;}
        .steps-list li::before {
            content: counter(step-counter); counter-increment: step-counter; position: absolute; left: 0; top: 0;
            background-color: var(--color-secundario); color: white; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem;
        }

        .consejo-box {
            background-color: #fff9c4;
            border-left: 4px solid #fbc02d;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .oculto { display: none !important; }
    </style>
</head>

            </div>
            <div style="border-top: 2px solid var(--color-secundario); margin-bottom: 15px;"></div>
            <ol id="ui-lista-preparacion" class="steps-list"></ol>

            <div id="contenedor-consejo" class="oculto">

                <div id="ui-texto-consejo" class="consejo-box"></div>
            </div>
            
        </main>
    </div>

    <!-- Constructor de la Pantalla -->
    <script>
        const parametrosURL = new URLSearchParams(window.location.search);
        const idReceta = parametrosURL.get('id');
        const receta = baseDeDatosRecetas[idReceta];

        if (!receta) {
            document.getElementById('ui-titulo').innerText = "Receta no encontrada";
            document.getElementById('ui-descripcion').innerText = "Vuelve al menú principal y selecciona otra opción.";
        } else {
            document.title = receta.titulo + " - Recetario";
            document.getElementById('ui-categoria').innerText = "Recetas " + receta.categoria;
            document.getElementById('ui-imagen').src = receta.imagen;
            document.getElementById('ui-titulo').innerText = receta.titulo;
            document.getElementById('ui-descripcion').innerText = receta.descripcion;

            if(receta.audios) {
                if(receta.audios.introduccion) {
                    document.getElementById('audio-intro').src = receta.audios.introduccion;
                }
                if(receta.audios.ingredientes) {
                    document.getElementById('audio-ingredientes').src = receta.audios.ingredientes;
                    document.getElementById('btn-audio-ingredientes').classList.remove('oculto');
                }
                if(receta.audios.aderezo) {
                    document.getElementById('audio-aderezo').src = receta.audios.aderezo;
                    document.getElementById('btn-audio-aderezo').classList.remove('oculto');
                }
                if(receta.audios.preparacion) {
                    document.getElementById('audio-preparacion').src = receta.audios.preparacion;
                    document.getElementById('btn-audio-preparacion').classList.remove('oculto');
                }
                if(receta.audios.consejo) {
                    document.getElementById('audio-consejo').src = receta.audios.consejo;
                    document.getElementById('btn-audio-consejo').classList.remove('oculto');
                }
            }

            const listaIngr = document.getElementById('ui-lista-ingredientes');
            receta.ingredientes.forEach(ingrediente => {
                let li = document.createElement('li');
                // NUEVO: Poner en negrita el texto antes de los dos puntos en ingredientes
                let ingredienteFormateado = ingrediente.replace(/^(.*?):/, '<strong>$1:</strong>');
                li.innerHTML = ingredienteFormateado;
                listaIngr.appendChild(li);
            });

            if (receta.aderezo && receta.aderezo.length > 0) {
                document.getElementById('contenedor-aderezo').classList.remove('oculto');
                const listaAderezo = document.getElementById('ui-lista-aderezo');
                receta.aderezo.forEach(item => {
                    let li = document.createElement('li');
                    // Aplicar la misma regla de negrita para aderezos
                    let itemFormateado = item.replace(/^(.*?):/, '<strong>$1:</strong>');
                    li.innerHTML = itemFormateado;
                    listaAderezo.appendChild(li);
                });
            }

            const listaPrep = document.getElementById('ui-lista-preparacion');
            receta.preparacion.forEach(paso => {
                let li = document.createElement('li');
                let pasoFormateado = paso.replace(/^(.*?):/, '<strong>$1:</strong>');
                li.innerHTML = pasoFormateado;
                listaPrep.appendChild(li);
            });

            if (receta.consejo_nutriologa) {
                document.getElementById('contenedor-consejo').classList.remove('oculto');
                document.getElementById('ui-texto-consejo').innerText = receta.consejo_nutriologa;
            }

            // I. Intentar reproducir la introducción automáticamente (Solo la primera vez por receta)
            window.addEventListener('DOMContentLoaded', () => {
                const audioIntro = document.getElementById('audio-intro');
                const claveMemoriaReceta = 'audioReproducido_' + idReceta;

                if(audioIntro.src && !audioIntro.src.endsWith('undefined')) { 
                    if (!sessionStorage.getItem(claveMemoriaReceta)) {
                        let promesa = audioIntro.play();
                        if (promesa !== undefined) {
                            promesa.then(() => {
                                audioActual = audioIntro;
                                sessionStorage.setItem(claveMemoriaReceta, 'true');
                            }).catch(error => {
                                console.warn("Autoplay bloqueado. El usuario necesita interactuar.");
                            });
                        }
                    }
                }
            });
        }

        const botonesAudio = document.querySelectorAll('.control-audio');
        let audioActual = null; 
        let botonActual = null; 

        botonesAudio.forEach(boton => {
            boton.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const audioSeleccionado = document.getElementById(targetId);

                if (audioActual === audioSeleccionado && !audioSeleccionado.paused) {
                    audioSeleccionado.pause();
                    this.innerHTML = "▶";
                    this.classList.remove('playing');
                    return; 
                }

                if (audioActual && !audioActual.paused) {
                    audioActual.pause();
                    audioActual.currentTime = 0; 
                    if (botonActual) {
                        botonActual.innerHTML = "▶";
                        botonActual.classList.remove('playing');
                    }
                }

                audioSeleccionado.play();
                this.innerHTML = "⏸"; 
                this.classList.add('playing'); 
                
                audioActual = audioSeleccionado;
                botonActual = this;

                audioSeleccionado.addEventListener('ended', function() {
                    botonActual.innerHTML = "▶";
                    botonActual.classList.remove('playing');
                }, { once: true }); 
            });
        });
    </script>
